name: Build

on:
  workflow_dispatch:  # manual only — disabled automatic build
    inputs:
      source_ref:
        description: Git ref to build instead of the workflow ref
        required: false
        default: ""
        type: string
      release_tag:
        description: Version used in a manually packaged Linux AppImage
        required: false
        default: v0.2.8
        type: string
  push:
    branches: [disabled-auto-build]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            kind: linux
            artifact: entropy-linux
            binary: target/release/entropy
          - os: windows-latest
            kind: windows
            artifact: entropy-windows
            binary: target/release/entropy.exe
          - os: macos-15
            kind: macos
            artifact: entropy-macos-arm64
            binary: dist/macos/*.app.zip
            target: aarch64-apple-darwin
          - os: macos-15-intel
            kind: macos
            artifact: entropy-macos-x86_64
            binary: dist/macos/*.app.zip
            target: x86_64-apple-darwin

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.sha }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Install macOS Rust target
        if: matrix.kind == 'macos'
        run: rustup target add ${{ matrix.target }}

      - name: Install Linux dependencies
        if: matrix.kind == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libhidapi-dev \
            libudev-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-dev \
            libssl-dev \
            libgtk-3-dev

      - name: Build
        if: matrix.kind != 'macos'
        run: cargo build --release

      - name: Build macOS app bundle
        if: matrix.kind == 'macos'
        run: TARGET="${{ matrix.target }}" scripts/build_macos_app.sh

      - name: Test
        if: matrix.kind == 'linux'
        run: cargo test --all-targets

      - name: Package manual Linux AppImage
        if: github.event_name == 'workflow_dispatch' && matrix.kind == 'linux'
        shell: bash
        run: |
          asset="entropy-${{ inputs.release_tag }}-x86_64-glibc2.35.AppImage"
          scripts/build_linux_appimage.sh "${{ inputs.release_tag }}" "dist/release/$asset"

      - name: Verify manual Linux AppImage glibc compatibility
        if: github.event_name == 'workflow_dispatch' && matrix.kind == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          max_glibc=""
          while IFS= read -r binary; do
            required_glibc="$(readelf --version-info "$binary" 2>/dev/null | grep -o 'GLIBC_[0-9.]*' | sort -Vu | tail -n1 || true)"
            if [[ -n "$required_glibc" ]] && { [[ -z "$max_glibc" ]] || dpkg --compare-versions "${max_glibc#GLIBC_}" lt "${required_glibc#GLIBC_}"; }; then
              max_glibc="$required_glibc"
            fi
          done < <(find target/appimage/Entropy.AppDir/usr -type f)
          test -n "$max_glibc"
          echo "Highest bundled glibc requirement: $max_glibc"
          dpkg --compare-versions "${max_glibc#GLIBC_}" le 2.38

      - name: Upload manual Linux AppImage
        if: github.event_name == 'workflow_dispatch' && matrix.kind == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: entropy-${{ inputs.release_tag }}-linux-glibc2.35
          path: dist/release/*.AppImage
          if-no-files-found: error

      - name: Upload artifact
        if: github.event_name != 'workflow_dispatch' || matrix.kind != 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.binary }}
          if-no-files-found: error
